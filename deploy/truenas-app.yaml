# TrueNAS SCALE 25.10 · Apps → Discover Apps → ⋮ → Install via YAML
# App name: home-utilities  (deploy/nas-updater.sh expects this name)
#
# Runs the image GitHub Actions publishes for every push to main. Updates are
# applied from Settings → Software update (see DEPLOY.md, "Updates").
#
# Before pasting, fill in every <...> value. The image is private, so first sign
# in to ghcr.io under Apps → Configuration → Docker registries (DEPLOY.md step 3).
services:
  app:
    image: ghcr.io/thyglizzyglobber/home-utilities:latest
    container_name: home-utilities
    restart: unless-stopped
    ports:
      - '30080:3000'
    volumes:
      # Child dataset owned by UID/GID 1001. Holds db/, inbox/ and config/.
      - /mnt/SSD/home-utilities/data:/data
    environment:
      DATA_DIR: /data
      AUTH_SECRET: '<openssl rand -base64 48>'
      AUTH_SESSION_DAYS: '30'
      DEFAULT_CURRENCY: AUD
      DEFAULT_LOCALE: en-AU
      DEFAULT_TIMEZONE: Australia/Melbourne
      DEFAULT_FISCAL_YEAR_START_MONTH: '7'
      # Email ingestion (leave IMAP_USER/IMAP_PASSWORD empty to disable)
      IMAP_HOST: imap.gmail.com
      IMAP_PORT: '993'
      IMAP_SECURE: 'true'
      IMAP_USER: ''
      IMAP_PASSWORD: ''
      IMAP_MAILBOX: INBOX
      IMAP_POLL_INTERVAL_SECONDS: '300'
      # AI extraction (leave empty to send unknown providers to the review queue)
      ANTHROPIC_API_KEY: ''
      ANTHROPIC_MODEL: claude-sonnet-5
      EXTRACTOR_CONFIDENCE_THRESHOLD: '0.85'
      # Software update checks: fine-grained GitHub token, this repo only,
      # read-only "Actions" + "Contents". Leave empty to skip the check.
      UPDATE_REPO: ThyGlizzyGlobber/Home-Utilities-Software--Prototype-1-
      UPDATE_GITHUB_TOKEN: ''
      DEMO_MODE: 'false'
      LOG_LEVEL: info
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
