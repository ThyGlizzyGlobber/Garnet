# ALTERNATIVE install. The primary path is the Custom App form with an
# ixVolume (DEPLOY.md §3). Use this only if you prefer your own dataset; then
# run the updater with DATASET=SSD/home-utilities/data.
#
# TrueNAS SCALE 25.10 · Apps → Discover Apps → ⋮ → Install via YAML
# App name: home-utilities  (deploy/nas-updater.sh expects this name)
#
# Runs the image GitHub Actions publishes for every push to main. Updates are
# applied from Settings → Software update (DEPLOY.md §1 and §4).
#
# Before pasting, fill in every <...> value. The image is private, so first sign
# in to ghcr.io under Apps → Configuration → Docker registries (DEPLOY.md §2).
services:
  app:
    image: ghcr.io/thyglizzyglobber/home-utilities:latest
    container_name: home-utilities
    restart: unless-stopped
    ports:
      - '30080:3000'
    volumes:
      # Dataset owned by UID/GID 568 (apps). Holds db/, inbox/ and config/.
      - /mnt/SSD/home-utilities/data:/data
    environment:
      DATA_DIR: /data
      AUTH_SECRET: '<openssl rand -base64 48>'
      # Days a PIN unlock lasts; days a browser stays trusted after a full sign-in.
      AUTH_SESSION_DAYS: '7'
      AUTH_DEVICE_DAYS: '180'
      # Sign-in (DEPLOY.md §8): without an email service nobody can sign in by code.
      APP_URL: '<https://your-public-address>'
      OPERATOR_EMAILS: '<your email>'
      RESEND_API_KEY: '<re_...>'
      EMAIL_FROM: 'Home Utilities <bills@your-domain>'
      GOOGLE_CLIENT_ID: ''
      GOOGLE_CLIENT_SECRET: ''
      # Household bills addresses (DEPLOY.md §9); leave empty to turn them off.
      BILLS_ADDRESS_TEMPLATE: ''
      INBOUND_EMAIL_SECRET: ''
      DEFAULT_CURRENCY: AUD
      DEFAULT_LOCALE: en-AU
      DEFAULT_TIMEZONE: Australia/Melbourne
      DEFAULT_FISCAL_YEAR_START_MONTH: '7'
      # AI bill reader: without a key every document waits in the Inbox for entry by hand
      ANTHROPIC_API_KEY: ''
      ANTHROPIC_MODEL: claude-opus-5
      EXTRACTOR_CONFIDENCE_THRESHOLD: '0.85'
      # Software update checks: fine-grained GitHub token, this repo only,
      # read-only "Actions" + "Contents". Leave empty to skip the check.
      UPDATE_REPO: ThyGlizzyGlobber/Home-Utilities-Software--Prototype-1-
      UPDATE_GITHUB_TOKEN: ''
      DEMO_MODE: 'false'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
