# Local dev/prod-like run: `docker compose up --build`
# All persistent data lands in ./data (DB, config, raw bills in inbox/).
services:
  app:
    build: .
    image: brjlabs/home-utilities:0.4.0
    container_name: home-utilities
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      PORT: 3000
    volumes:
      - ./data:/data
